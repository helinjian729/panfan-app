name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== Lint and Test ====================
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run lint
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        run: npm run test:cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/panfan_test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          fail_ci_if_error: false

  # ==================== Build Docker Image ====================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Save image digest
        run: |
          echo "IMAGE_DIGEST=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format='{{index .RepoDigests 0}}' | cut -d@ -f2)" >> $GITHUB_OUTPUT
        id: digest

  # ==================== Deploy to Staging ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        run: |
          ssh ${{ vars.STAGING_USER }}@${{ vars.STAGING_HOST }} "
            cd /app/panfan &&
            docker compose -f docker-compose.staging.yml pull &&
            docker compose -f docker-compose.staging.yml up -d &&
            docker image prune -f
          "

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -sf http://${{ vars.STAGING_HOST }}/health; then
              echo "Staging deployment successful"
              exit 0
            fi
            echo "Waiting for service to be ready..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

  # ==================== Deploy to Production ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Backup database
        run: |
          ssh ${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }} "
            cd /app/panfan &&
            ./scripts/backup.sh
          "

      - name: Deploy to production server
        run: |
          ssh ${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }} "
            cd /app/panfan &&
            docker compose -f docker-compose.production.yml pull &&
            docker compose -f docker-compose.production.yml up -d &&
            docker image prune -f
          "

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -sf https://${{ vars.PRODUCTION_DOMAIN }}/health; then
              echo "Production deployment successful"
              exit 0
            fi
            echo "Waiting for service to be ready..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure

  # ==================== Build for Local/Development ====================
  build-local:
    name: Build for Local Development
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[docker]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images locally
        run: |
          cd deployment/docker
          docker compose build

      - name: Save images to tar
        run: |
          docker save $(docker compose -f deployment/docker/docker-compose.yml config --images) -o deployment/docker/images.tar

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: deployment/docker/images.tar
          retention-days: 7